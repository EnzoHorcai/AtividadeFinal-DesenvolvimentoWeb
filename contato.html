<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contato | Enzo Horçai</title>
</head>
<body>

    <nav>
        <h2 class="menu">Menu</h2>
        <ul>
            <li><a href="index.html">Página Inicial</a></li>
            <li><a href="projetos.html">Meus Projetos</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>

    <div class="conteudo-principal">
        <header>
            <h1>Entre em contato</h1>
            <p>Gostou do meu perfil? Sinta-se à vontade para me enviar uma mensagem!</p>
        </header>

        <main>
            <form id="formContato" class="form-contato">
                <div class="form-grupo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" required placeholder="Seu nome">
                </div>
                <div class="form-grupo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="form-grupo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>
                <button type="submit">Enviar Mensagem</button>
            </form>
            
            <div id="zonaFeedback"></div>
        </main>

        <footer>
            <hr>
            <p class="footer_portfolio">2026 - Portfólio Enzo Horçai</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
